services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oceanshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - oceanshield-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    container_name: oceanshield-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oceanshield-network

networks:
  oceanshield-network:
    driver: bridge
